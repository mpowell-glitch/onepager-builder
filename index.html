<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit One-Pager Builder — Choice Charter School</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:     #1F3864;
  --blue:     #2E5FA3;
  --mid:      #4A7CC7;
  --light:    #D6E4F0;
  --gold:     #F4B942;
  --gold-bg:  #FFF8E7;
  --grey:     #F4F6F9;
  --border:   #DDE3ED;
  --text:     #1a1a2e;
  --muted:    #6B7A99;
  --white:    #ffffff;
  --success:  #2E7D32;
  --warn:     #E65100;
  --radius:   12px;
  --shadow:   0 4px 24px rgba(31,56,100,0.10);
  --shadow-lg:0 8px 40px rgba(31,56,100,0.16);
}

body {
  font-family: 'DM Sans', sans-serif;
  background: linear-gradient(135deg, #EBF3FB 0%, #F4F6F9 50%, #FFF8E7 100%);
  min-height: 100vh;
  color: var(--text);
}

/* ── SETUP SCREEN ── */
#setup-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}
.setup-card {
  background: var(--white);
  border-radius: 20px;
  box-shadow: var(--shadow-lg);
  padding: 48px;
  max-width: 520px;
  width: 100%;
  text-align: center;
}
.setup-logo {
  width: 56px;
  height: 56px;
  background: var(--navy);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
  font-family: 'DM Serif Display', serif;
  color: var(--white);
  font-size: 22px;
}
.setup-card h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  color: var(--navy);
  margin-bottom: 8px;
}
.setup-card p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 32px;
}
.setup-input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--text);
  margin-bottom: 16px;
  transition: border-color 0.2s;
  background: var(--grey);
}
.setup-input:focus { outline: none; border-color: var(--blue); background: var(--white); }
.setup-btn {
  width: 100%;
  padding: 14px;
  background: var(--navy);
  color: var(--white);
  border: none;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}
.setup-btn:hover { background: var(--blue); transform: translateY(-1px); }
.setup-error { color: #c62828; font-size: 13px; margin-top: 8px; }

/* ── MAIN APP ── */
#app { display: none; flex-direction: column; height: 100vh; }

/* ── HEADER ── */
.app-header {
  background: var(--navy);
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-logo {
  width: 36px; height: 36px;
  background: var(--gold);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Serif Display', serif;
  color: var(--navy);
  font-size: 16px;
  font-weight: bold;
}
.header-title {
  font-family: 'DM Serif Display', serif;
  color: var(--white);
  font-size: 17px;
}
.header-subtitle { color: var(--light); font-size: 12px; }

/* ── MODE TOGGLE ── */
.mode-toggle {
  display: flex;
  background: rgba(255,255,255,0.12);
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}
.mode-btn {
  padding: 6px 16px;
  border: none;
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  color: rgba(255,255,255,0.7);
  background: transparent;
}
.mode-btn.active { background: var(--white); color: var(--navy); }

/* ── BODY ── */
.app-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 260px;
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
.sidebar-section { padding: 20px 16px 12px; }
.sidebar-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 10px;
}

/* Wizard steps */
.wizard-step {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  margin-bottom: 4px;
  cursor: pointer;
  transition: background 0.15s;
}
.wizard-step:hover { background: var(--grey); }
.wizard-step.active { background: var(--light); }
.wizard-step.done .step-num { background: var(--success); color: var(--white); }
.wizard-step.active .step-num { background: var(--navy); color: var(--white); }
.step-num {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--border);
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.step-text { font-size: 12px; line-height: 1.4; color: var(--text); }
.step-text.done-text { color: var(--muted); }

/* Progress */
.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 16px 16px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--navy), var(--blue));
  border-radius: 2px;
  transition: width 0.4s ease;
}

/* Reset btn */
.reset-btn {
  margin: auto 16px 16px;
  padding: 8px 12px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  width: calc(100% - 32px);
  transition: all 0.2s;
}
.reset-btn:hover { border-color: var(--warn); color: var(--warn); }

/* ── CHAT AREA ── */
.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--grey);
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.message { display: flex; gap: 12px; max-width: 800px; }
.message.user { align-self: flex-end; flex-direction: row-reverse; }

.avatar {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  font-weight: 600;
}
.avatar.ai { background: var(--navy); color: var(--white); font-family: 'DM Serif Display', serif; font-size: 16px; }
.avatar.user { background: var(--gold); color: var(--navy); }

.bubble {
  padding: 14px 18px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.65;
  max-width: calc(100% - 48px);
}
.bubble.ai {
  background: var(--white);
  box-shadow: var(--shadow);
  border-bottom-left-radius: 4px;
  color: var(--text);
}
.bubble.user {
  background: var(--navy);
  color: var(--white);
  border-bottom-right-radius: 4px;
}
.bubble.ai strong { color: var(--navy); }
.bubble.ai em { color: var(--muted); }

/* Push-back callout */
.pushback {
  background: #FFF3E0;
  border-left: 3px solid var(--warn);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 8px 0 4px;
  font-size: 13px;
  color: var(--warn);
}
.pushback strong { display: block; margin-bottom: 4px; }

/* Typing indicator */
.typing { display: flex; align-items: center; gap: 4px; padding: 14px 18px; }
.typing-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  animation: bounce 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* ── INPUT AREA ── */
.input-area {
  padding: 16px 24px 20px;
  background: var(--white);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: flex-end;
}
.input-wrap { flex: 1; position: relative; }
textarea {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--text);
  resize: none;
  max-height: 140px;
  min-height: 48px;
  line-height: 1.5;
  transition: border-color 0.2s;
  background: var(--grey);
}
textarea:focus { outline: none; border-color: var(--blue); background: var(--white); }
.send-btn {
  width: 48px; height: 48px;
  background: var(--navy);
  border: none;
  border-radius: 12px;
  color: var(--white);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, transform 0.1s;
  flex-shrink: 0;
}
.send-btn:hover:not(:disabled) { background: var(--blue); transform: translateY(-1px); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.send-btn svg { width: 20px; height: 20px; }

/* ── ONEPAGER PANEL ── */
.onepager-panel {
  width: 0;
  overflow: hidden;
  transition: width 0.4s ease;
  background: var(--white);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.onepager-panel.open { width: 480px; }

.panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  background: var(--navy);
}
.panel-title {
  font-family: 'DM Serif Display', serif;
  color: var(--white);
  font-size: 16px;
}
.panel-actions { display: flex; gap: 8px; }
.panel-btn {
  padding: 6px 14px;
  border-radius: 7px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.3);
  color: var(--white);
  background: rgba(255,255,255,0.1);
  transition: all 0.2s;
}
.panel-btn:hover { background: rgba(255,255,255,0.2); }
.panel-btn.primary { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.panel-btn.primary:hover { background: #f5c842; }

.panel-content {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}
.panel-content iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* close panel btn */
.close-panel {
  position: absolute;
  top: 70px;
  right: 0;
  width: 28px; height: 56px;
  background: var(--navy);
  border: none;
  border-radius: 8px 0 0 8px;
  color: var(--white);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  z-index: 10;
  transition: background 0.2s;
}
.close-panel:hover { background: var(--blue); }

/* ── WELCOME MESSAGE ── */
.welcome-card {
  background: var(--white);
  border-radius: 16px;
  padding: 28px 24px;
  box-shadow: var(--shadow);
  margin-bottom: 8px;
}
.welcome-card h2 {
  font-family: 'DM Serif Display', serif;
  color: var(--navy);
  font-size: 20px;
  margin-bottom: 8px;
}
.welcome-card p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
.mode-cards { display: flex; gap: 10px; }
.mode-card {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.mode-card:hover { border-color: var(--blue); background: var(--light); }
.mode-card.selected { border-color: var(--navy); background: var(--light); }
.mode-card-title { font-weight: 600; font-size: 13px; color: var(--navy); margin-bottom: 4px; }
.mode-card-desc { font-size: 12px; color: var(--muted); line-height: 1.4; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .onepager-panel.open { width: 100%; position: fixed; top: 60px; left: 0; right: 0; bottom: 0; z-index: 100; }
}

/* ── ANIMATIONS ── */
.message { animation: fadeUp 0.25s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>

// ── SETUP ──
function checkAccess() {
  const code = document.getElementById('access-code').value.trim();
  if (code === ACCESS_CODE) {
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    initApp();
  } else {
    document.getElementById('setup-error').textContent = 'Incorrect access code. Contact your administrator.';
    document.getElementById('access-code').value = '';
  }
}
document.getElementById('access-code').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAccess();
});

// ── INIT ──
function initApp() {
  buildSidebar();
  startConversation();
}

function buildSidebar() {
  const list = document.getElementById('step-list');
  list.innerHTML = '';
  WIZARD_STEPS.forEach((step, i) => {
    const el = document.createElement('div');
    el.className = 'wizard-step' + (i === 0 ? ' active' : '');
    el.id = `step-${i}`;
    el.innerHTML = `
      <div class="step-num">${i + 1}</div>
      <div class="step-text">${step.label}<br><span style="color:var(--muted);font-size:11px;">${step.desc}</span></div>
    `;
    list.appendChild(el);
  });
}

function updateSidebar(step) {
  currentStep = step;
  WIZARD_STEPS.forEach((_, i) => {
    const el = document.getElementById(`step-${i}`);
    if (!el) return;
    el.className = 'wizard-step' + (i < step ? ' done' : i === step ? ' active' : '');
    el.querySelector('.step-num').textContent = i < step ? '✓' : i + 1;
  });
  const pct = Math.round((step / WIZARD_STEPS.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ── MODE ──
function setMode(mode) {
  currentMode = mode;
  document.getElementById('wizard-btn').className = 'mode-btn' + (mode === 'wizard' ? ' active' : '');
  document.getElementById('convo-btn').className = 'mode-btn' + (mode === 'conversation' ? ' active' : '');
  document.getElementById('sidebar').style.display = mode === 'wizard' ? 'flex' : 'none';
  document.getElementById('sidebar-label').textContent = mode === 'wizard' ? 'Wizard Steps' : 'About this tool';
  resetConversation();
}

async function startConversation() {
  messages = [];
  const intro = currentMode === 'wizard'
    ? `Welcome to the Choice Charter Unit One-Pager Builder. I'm going to walk you through building a unit plan step by step — I'll ask one question at a time and push back before we move forward if something needs rethinking.\n\nLet's start at the beginning.\n\n**Step 1 of 11 — Your Team**\n\nTell me:\n- What is the name of this seminar or unit?\n- What grade level is it for?\n- Who is on the teaching team — what subjects and roles does each person bring?`
    : `Welcome to the Choice Charter Unit One-Pager Builder.\n\nI'm here to help you build a unit one-pager using the Headrush planning framework. I know the Task Design Guide rules, the Headrush standards, and the MN Career Ready Practices.\n\nYou can work in any order — tell me about your unit, your team, your wicked question, or wherever you want to start. I'll push back when something needs rethinking.\n\nWhat are you working on?`;

  addMessage('ai', intro);
  if (currentMode === 'wizard') updateSidebar(0);
}

function resetConversation() {
  messages = [];
  generatedHTML = '';
  document.getElementById('messages').innerHTML = '';
  closePanel();
  if (currentMode === 'wizard') updateSidebar(0);
  startConversation();
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoResize(input);
  disableSend(true);

  addMessage('user', text);
  messages.push({ role: 'user', content: text });

  showTyping();

  try {
  const formData = new URLSearchParams();
  formData.append('data', JSON.stringify({ messages }));

  const response = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: formData.toString()
  });
    
    const data = await response.json();
    hideTyping();

    if (data.error) {
      addMessage('ai', `⚠️ Something went wrong: ${data.error}\n\nPlease try again or contact your administrator.`);
      disableSend(false);
      return;
    }

    const reply = data.content;
    messages.push({ role: 'assistant', content: reply });

    // Check if reply contains a one-pager
    if (reply.trim().startsWith('<!DOCTYPE html>') || reply.trim().startsWith('<html')) {
      generatedHTML = reply;
      addMessage('ai', '✅ Your one-pager has been generated! Click the **Download** or **Copy HTML** button to save it.');
      openPanel(reply);
      if (currentMode === 'wizard') updateSidebar(WIZARD_STEPS.length);
    } else {
      addMessage('ai', reply);
      // Advance wizard step based on content signals
      if (currentMode === 'wizard') advanceStep(reply, text);
    }

  } catch (err) {
    hideTyping();
    addMessage('ai', `⚠️ Could not reach the server. Check your connection and try again.\n\n*Error: ${err.message}*`);
  }

  disableSend(false);
}

function advanceStep(aiReply, userInput) {
  // Heuristic step advancement based on conversation signals
  const lower = aiReply.toLowerCase();
  const stepSignals = [
    ['step 2', 'wicked question'],
    ['step 3', 'learning mission 1', 'engagement'],
    ['step 4', 'learning mission 2', 'investigation'],
    ['step 5', 'learning mission 3', 'collision'],
    ['step 6', 'learning mission 4', 'articulation'],
    ['step 7', 'standards', 'which standards'],
    ['step 8', 'crp', 'career ready'],
    ['step 9', 'voice', 'choice', 'portfolio option'],
    ['step 10', 'culminating', 'final product'],
    ['step 11', 'generate', 'ready to build'],
  ];
  stepSignals.forEach((signals, idx) => {
    if (signals.some(s => lower.includes(s))) {
      if (idx + 1 > currentStep) updateSidebar(idx + 1);
    }
  });
}

// ── UI HELPERS ──
function addMessage(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'ai' ? 'C' : '👤';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  bubble.innerHTML = formatText(text);

  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function formatText(text) {
  // Basic markdown-like formatting
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code style="background:#f0f0f0;padding:2px 5px;border-radius:4px;font-size:12px;">$1</code>')
    .replace(/\n\n/g, '</p><p style="margin-top:8px;">')
    .replace(/\n/g, '<br>')
    .replace(/^/, '<p>')
    .replace(/$/, '</p>');
}

let typingEl = null;
function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="avatar ai">C</div>
    <div class="bubble ai typing">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}
function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function disableSend(disabled) {
  document.getElementById('send-btn').disabled = disabled;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

// ── ONE-PAGER PANEL ──
function openPanel(html) {
  // Inject logo into generated one-pager
  html = html.replace(/SCHOOL_LOGO/g, LOGO_URI);
  const panel = document.getElementById('onepager-panel');
  const content = document.getElementById('panel-content');
  panel.classList.add('open');

  // Use iframe srcdoc for sandboxed rendering
  const iframe = document.createElement('iframe');
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = 'none';
  iframe.srcdoc = html;
  content.innerHTML = '';
  content.appendChild(iframe);
}

function closePanel() {
  document.getElementById('onepager-panel').classList.remove('open');
}

function copyHTML() {
  if (!generatedHTML) return;
  navigator.clipboard.writeText(generatedHTML).then(() => {
    const btn = event.target;
    btn.textContent = '✓ Copied!';
    setTimeout(() => btn.textContent = 'Copy HTML', 2000);
  });
}

function downloadHTML() {
  if (!generatedHTML) return;
  const blob = new Blob([generatedHTML], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'unit-onepager.html';
  a.click();
}
